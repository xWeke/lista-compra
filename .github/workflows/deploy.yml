# Publica la app en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Requisitos en el repo de GitHub:
#   - Settings → Pages → Source: "GitHub Actions"
#   - Settings → Secrets and variables → Actions → secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, se cancela el que estaba en cola.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Pruebas E2E (WebKit, el motor de Safari) con Supabase simulado: si fallan, no se publica nada.
      - name: Instalar WebKit para las pruebas
        run: npx playwright install --with-deps webkit

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Guardar informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
